plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sonrac.game'
    compileSdk 35
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.sonrac.game'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            // SDL's Java glue must come from the same SDL3 tree libSDL3.so is built
            // from: SDLActivity refuses to start when the versions differ.
            java.srcDirs += ['C:/Users/EduPedu/Desktop/LibertyRecompAndroid/glue/rexglue-sdk-main/thirdparty/sdl3/android-project/app/src/main/java']
        }
    }

    packaging {
        jniLibs {
            // Real files in nativeLibraryDir: the runtime finds its GPU plugin next to itself.
            useLegacyPackaging = true
            keepDebugSymbols += '**/*.so'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
